<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>x-eromeno-x — Art Engine</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="x-eromeno-x.css">
</head>
<body>

<div class="toolApp">

  <div class="toolTopBar">
    <button class="toolBack" onclick="location.href='../index.html'">‹ Back</button>
    <h1 class="toolTitle">x-eromeno-x</h1>
    <button class="toolAction" id="btnRandomize" title="Random seed">⟳</button>
  </div>

  <div class="xEromEnoXPreview">
    <canvas id="xEromEnoXCanvas"></canvas>
  </div>

  <div class="toolView">

    <div class="xEromEnoXSection">Style</div>

    <div class="sliderRow">
      <div class="sliderTop"><label>Shape Complexity</label><span class="val" id="shapeComplexityVal">5</span></div>
      <input type="range" id="shapeComplexity" min="3" max="20" step="1" value="5">
    </div>

    <div class="fieldRow">
      <label>Color 1</label>
      <input type="color" id="color1" value="#3b82f6">
    </div>

    <div class="fieldRow">
      <label>Color 2</label>
      <input type="color" id="color2" value="#a855f7">
    </div>

    <div class="fieldRow">
      <label>Background Color</label>
      <input type="color" id="bgColor" value="#0d0f16">
    </div>

    <div class="fieldRow">
      <label>Transparent Background</label>
      <input type="checkbox" id="bgTransparent">
    </div>

    <div class="xEromEnoXSection">Size</div>

    <div class="fieldRow">
      <label>Size</label>
      <select id="size">
        <option value="square" selected>Square 1500×1500</option>
        <option value="portrait">Portrait 900×1600</option>
        <option value="landscape">Landscape 1600×900</option>
        <option value="a17">Samsung A17 wallpaper 1080×2340</option>
        <option value="desktop">Desktop wallpaper 1920×1080</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div class="fieldRow" id="customSizeRow" style="display: none;">
      <label>Custom Size</label>
      <input type="number" id="customWidth" value="1080" min="1" max="8192" inputmode="numeric">
      <input type="number" id="customHeight" value="2340" min="1" max="8192" inputmode="numeric">
    </div>

    <div class="xEromEnoXSection">Additional Options</div>

    <div class="sliderRow">
      <div class="sliderTop"><label>Pattern Density</label><span class="val" id="patternDensityVal">0.5</span></div>
      <input type="range" id="patternDensity" min="0.1" max="1" step="0.05" value="0.5">
    </div>

    <div class="sliderRow">
      <div class="sliderTop"><label>Rotation</label><span class="val" id="rotationVal">0</span></div>
      <input type="range" id="rotation" min="0" max="360" step="1" value="0">
    </div>

    <div class="sliderRow">
      <div class="sliderTop"><label>Outline Thickness</label><span class="val" id="outlineThicknessVal">1.3</span></div>
      <input type="range" id="outlineThickness" min="0.5" max="5" step="0.1" value="1.3">
    </div>

    <div class="xEromEnoXSection">Seed</div>

    <div class="fieldRow">
      <label>Seed</label>
      <input type="number" id="seed" value="1" min="0" max="999999" inputmode="numeric">
    </div>

  </div>

  <div class="exportBar">
    <button class="exportBtn" id="btnExport">Export PNG</button>
    <button class="exportBtn primary" id="btnGenerate">Generate</button>
  </div>

</div>

<script src="x-eromeno-x.js"></script>
</body>
</html>
